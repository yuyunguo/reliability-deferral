[project]
name = "reliability-clinical-ai"
version = "0.1.0"
description = "Reliability as a First-Class Clinical AI Primitive"
requires-python = ">=3.10"
dependencies = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "joblib>=1.3",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "psycopg2-binary>=2.9",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "statsmodels>=0.14",
    "pyarrow>=14",
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
